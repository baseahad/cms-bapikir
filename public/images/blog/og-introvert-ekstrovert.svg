<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="530" r="200" fill="#22c55e" opacity="0.03"/>
  <circle cx="1100" cy="100" r="180" fill="#a855f7" opacity="0.03"/>

  <!-- Split visual - left side -->
  <line x1="600" y1="180" x2="600" y2="450" stroke="#22c55e" stroke-width="1" opacity="0.3"/>
  <circle cx="300" cy="280" r="60" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.4"/>
  <circle cx="900" cy="280" r="60" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.4"/>

  <!-- Connecting line -->
  <line x1="360" y1="280" x2="840" y2="280" stroke="#22c55e" stroke-width="1" opacity="0.2"/>

  <!-- Main title -->
  <text x="600" y="260" text-anchor="middle" font-family="sans-serif" font-size="52" font-weight="bold" fill="#f5f5f5" letter-spacing="-1">Aku Bukan Ekstrovert</text>
  <text x="600" y="320" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="bold" fill="#22c55e" letter-spacing="-0.5">Kamu Bukan Introvert</text>

  <!-- Subtitle -->
  <text x="600" y="380" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#888" letter-spacing="3">SYAKHSHIYAH ISLAMIYAH</text>

  <!-- Naruto - Sasuke hint -->
  <text x="300" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#22c55e" opacity="0.5">SIYASIYUN</text>
  <text x="900" y="380" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#a855f7" opacity="0.5">MUFAKKIRUN</text>

  <!-- Bottom accent -->
  <rect x="480" y="440" width="240" height="2" fill="#22c55e" opacity="0.5"/>

  <!-- Avatar hint -->
  <text x="600" y="480" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#666">Avathur Rahman &middot; avathur.id</text>

  <!-- Decorative dots -->
  <circle cx="200" cy="150" r="2" fill="#22c55e" opacity="0.2"/>
  <circle cx="1000" cy="480" r="2" fill="#a855f7" opacity="0.2"/>
  <circle cx="400" cy="500" r="1.5" fill="#22c55e" opacity="0.15"/>
  <circle cx="800" cy="130" r="1.5" fill="#a855f7" opacity="0.15"/>
</svg>
