<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a3622"/>
      <stop offset="100%" style="stop-color:#14532d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d4a843"/>
      <stop offset="100%" style="stop-color:#e6c87c"/>
    </linearGradient>
    <radialGradient id="flame" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.9"/>
      <stop offset="60%" style="stop-color:#d97706;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#flame)" opacity="0.25"/>
  <circle cx="600" cy="315" r="240" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.25"/>
  <line x1="150" y1="315" x2="1050" y2="315" stroke="url(#accent)" stroke-width="1" opacity="0.4"/>
  <text x="600" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#d4a843" letter-spacing="6">KISAH SAHABAT NABI</text>
  <text x="600" y="300" text-anchor="middle" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#ffffff">Salman Al-Farisi</text>
  <text x="600" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#e6c87c">Pencari Kebenaran yang</text>
  <text x="600" y="415" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#e6c87c">Tidak Pernah Berhenti</text>
  <text x="600" y="480" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#9ca3af">Dari bangsawan Persia, menjadi budak,</text>
  <text x="600" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#9ca3af">hingga keluarga Nabi. Shahih Bukhari 3941.</text>
  <rect x="450" y="545" width="300" height="2" fill="url(#accent)" opacity="0.3"/>
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">avathur.id</text>
</svg>
