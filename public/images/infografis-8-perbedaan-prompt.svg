<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f4f5"/>
    </linearGradient>
    <linearGradient id="navy-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#1a1a2e" flood-opacity="0.08"/>
    </filter>
    <filter id="badge-shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#1a1a2e" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Top accent -->
  <rect x="0" y="0" width="1200" height="4" fill="#1a1a2e"/>

  <!-- Title -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#1a1a2e">8 Perbedaan Prompt</text>
    <text x="0" y="30" font-family="Inter, sans-serif" font-size="16" fill="#71717a">Original vs Premium — Perbandingan Visual</text>
    <rect x="0" y="45" width="60" height="3" rx="1.5" fill="#1a1a2e" opacity="0.3"/>
  </g>

  <!-- LEFT COLUMN: Original (5 bagian) -->
  <g transform="translate(60, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="500" height="650" rx="12" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="500" height="60" rx="12" fill="#f4f4f5"/>
    <rect x="0" y="30" width="500" height="30" fill="#f4f4f5"/>
    <circle cx="30" cy="30" r="16" fill="#e4e4e7"/>
    <text x="30" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#71717a">×</text>
    <text x="60" y="36" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1a1a2e">Original — 5 Bagian</text>
    <text x="380" y="36" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#ef4444">Rp 20.000</text>

    <!-- Item 1 -->
    <rect x="20" y="80" width="460" height="70" rx="8" fill="#f4f4f5"/>
    <circle cx="38" cy="115" r="14" fill="#1a1a2e"/>
    <text x="38" y="120" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
    <text x="65" y="108" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1a1a2e">Lapisan Kepribadian</text>
    <text x="65" y="127" font-family="Inter, sans-serif" font-size="12" fill="#71717a">Sisi terang, gelap, potensi, kelemahan — langsung "bedah"</text>

    <!-- Item 2 -->
    <rect x="20" y="165" width="460" height="70" rx="8" fill="#f4f4f5"/>
    <circle cx="38" cy="200" r="14" fill="#1a1a2e"/>
    <text x="38" y="205" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
    <text x="65" y="193" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1a1a2e">Bedah Psikologis</text>
    <text x="65" y="212" font-family="Inter, sans-serif" font-size="12" fill="#71717a">"Jelaskan mengapa sifat itu muncul" — tanpa bukti awal</text>

    <!-- Item 3 -->
    <rect x="20" y="250" width="460" height="70" rx="8" fill="#f4f4f5"/>
    <circle cx="38" cy="285" r="14" fill="#1a1a2e"/>
    <text x="38" y="290" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
    <text x="65" y="278" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1a1a2e">Expose Kebiasaan Buruk</text>
    <text x="65" y="297" font-family="Inter, sans-serif" font-size="12" fill="#71717a">"Bukti dari chat" — tapi tanpa format keyakinan</text>

    <!-- Item 4 -->
    <rect x="20" y="335" width="460" height="70" rx="8" fill="#f4f4f5"/>
    <circle cx="38" cy="370" r="14" fill="#1a1a2e"/>
    <text x="38" y="375" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff">4</text>
    <text x="65" y="363" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1a1a2e">Risiko Jangka Pendek & Panjang</text>
    <text x="65" y="382" font-family="Inter, sans-serif" font-size="12" fill="#71717a">1 timeframe (6-12 bln) — tanpa probabilitas</text>

    <!-- Item 5 -->
    <rect x="20" y="420" width="460" height="70" rx="8" fill="#f4f4f5"/>
    <circle cx="38" cy="455" r="14" fill="#1a1a2e"/>
    <text x="38" y="460" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#ffffff">5</text>
    <text x="65" y="448" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#1a1a2e">Tips & Reset Diri</text>
    <text x="65" y="467" font-family="Inter, sans-serif" font-size="12" fill="#71717a">"5-7 aturan praktis" — abstrak, tidak terukur</text>

    <!-- Not found section -->
    <rect x="20" y="510" width="460" height="110" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="250" y="538" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#ef4444">Yang Tidak Ada di Versi Original</text>
    <text x="250" y="560" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#71717a">❌ Audit bukti sebelum analisis</text>
    <text x="250" y="578" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#71717a">❌ Skala keyakinan (0-100%)</text>
    <text x="250" y="596" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#71717a">❌ Interpretasi alternatif & faktor pembatal</text>
    <text x="250" y="614" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#71717a">❌ Kritik terhadap analisis sendiri</text>
  </g>

  <!-- VS Badge -->
  <g transform="translate(565, 370)" filter="url(#badge-shadow)">
    <circle cx="35" cy="35" r="35" fill="#1a1a2e"/>
    <text x="35" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#ffffff">VS</text>
  </g>

  <!-- RIGHT COLUMN: Premium (8 tahap) -->
  <g transform="translate(640, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="500" height="650" rx="12" fill="#ffffff" stroke="#1a1a2e" stroke-width="1.5"/>
    
    <!-- Header Premium -->
    <rect x="0" y="0" width="500" height="60" rx="12" fill="#1a1a2e"/>
    <rect x="0" y="30" width="500" height="30" fill="#1a1a2e"/>
    <text x="25" y="36" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Premium — 8 Tahap</text>
    <rect x="340" y="20" width="130" height="26" rx="4" fill="#22c55e" opacity="0.2"/>
    <text x="405" y="37" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#22c55e">Gratis + QRIS</text>

    <!-- Stage 1 -->
    <rect x="15" y="78" width="470" height="58" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <circle cx="30" cy="107" r="12" fill="#22c55e"/>
    <text x="30" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff">1</text>
    <text x="55" y="99" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1a1a2e">Audit Bukti</text>
    <text x="55" y="118" font-family="Inter, sans-serif" font-size="11" fill="#71717a">Jangan simpulkan sebelum audit selesai. Tabel: bukti, frekuensi, keyakinan.</text>

    <!-- Stage 2 -->
    <rect x="15" y="146" width="470" height="58" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <circle cx="30" cy="175" r="12" fill="#22c55e"/>
    <text x="30" y="180" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff">2</text>
    <text x="55" y="167" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1a1a2e">Analisis Kepribadian</text>
    <text x="55" y="186" font-family="Inter, sans-serif" font-size="11" fill="#71717a">16 dimensi + keyakinan (0-100%) + interpretasi alternatif + faktor pembatal</text>

    <!-- Stage 3 -->
    <rect x="15" y="214" width="470" height="58" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <circle cx="30" cy="243" r="12" fill="#22c55e"/>
    <text x="30" y="248" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff">3</text>
    <text x="55" y="235" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1a1a2e">Akar Psikologis</text>
    <text x="55" y="254" font-family="Inter, sans-serif" font-size="11" fill="#71717a">Kebutuhan psikologis, pengalaman masa lalu, keyakinan inti, asumsi dasar</text>

    <!-- Stage 4 -->
    <rect x="15" y="282" width="470" height="58" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <circle cx="30" cy="311" r="12" fill="#22c55e"/>
    <text x="30" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff">4</text>
    <text x="55" y="303" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1a1a2e">Kebiasaan Kecil, Pola Besar</text>
    <text x="55" y="322" font-family="Inter, sans-serif" font-size="11" fill="#71717a">Bukti, pola besar, dampak, asal-usul kebiasaan</text>

    <!-- Stage 5 -->
    <rect x="15" y="350" width="470" height="58" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <circle cx="30" cy="379" r="12" fill="#22c55e"/>
    <text x="30" y="384" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff">5</text>
    <text x="55" y="371" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1a1a2e">Risiko Masa Depan</text>
    <text x="55" y="390" font-family="Inter, sans-serif" font-size="11" fill="#71717a">3 timeframe (6bln / 1thn / 3thn) + probabilitas + 5 area dampak</text>

    <!-- Stage 6 -->
    <rect x="15" y="418" width="470" height="58" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <circle cx="30" cy="447" r="12" fill="#22c55e"/>
    <text x="30" y="452" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff">6</text>
    <text x="55" y="439" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1a1a2e">Intervensi 30 Hari</text>
    <text x="55" y="458" font-family="Inter, sans-serif" font-size="11" fill="#71717a">Tujuan, indikator, ukuran, evaluasi, alasan psikologis per langkah</text>

    <!-- Stage 7 (highlighted) -->
    <rect x="15" y="486" width="470" height="58" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
    <circle cx="30" cy="515" r="12" fill="#eab308"/>
    <text x="30" y="520" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff">7</text>
    <text x="55" y="507" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#1a1a2e">Kritik terhadap Analisis Sendiri ⭐</text>
    <text x="55" y="526" font-family="Inter, sans-serif" font-size="11" fill="#71717a">"Mengapa Analisis Ini Bisa Salah": asumsi, data kurang, bias</text>

    <!-- Stage 8 -->
    <rect x="15" y="554" width="470" height="65" rx="8" fill="#1a1a2e"/>
    <circle cx="30" cy="586" r="12" fill="#ffffff" opacity="0.2"/>
    <text x="30" y="591" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#1a1a2e" opacity="0.01">8</text>
    <text x="55" y="578" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Ringkasan Eksekutif</text>
    <text x="55" y="597" font-family="Inter, sans-serif" font-size="11" fill="#a1a1aa">3 kekuatan, 3 kelemahan, 1 blind spot, 1 kebiasaan kunci, 1 kalimat kejujuran</text>
  </g>

  <!-- Footer -->
  <g transform="translate(60, 770)">
    <text x="0" y="0" font-family="Inter, sans-serif" font-size="11" fill="#a1a1aa">Bapikir Prompting — avathur.id</text>
  </g>
</svg>
