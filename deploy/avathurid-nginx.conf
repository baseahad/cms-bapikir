server {
    listen 80;
    server_name avathur.id www.avathur.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name avathur.id www.avathur.id;

    ssl_certificate /etc/letsencrypt/live/avathur.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avathur.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50m;

    # Cache static assets — 30 hari
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable, max-age=2592000";
    }

    # Cache CSS/JS — 7 hari
    location ~* \.(css|js)$ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Cache fonts — 30 hari
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable, max-age=2592000";
    }

    # Main proxy — no cache (dynamic content)
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_cache off;

        # proxy_buffer_size tetap kepake walau proxy_buffering off (dia cuma
        # ngatur buffer buat baca HEADER respons, bukan body) - tanpa ini nginx
        # bisa balikin 502 "upstream sent too big header" kalau cookie sesi
        # Supabase dkk gede. JANGAN nyalain proxy_buffering, itu bakal
        # ngerusak streaming response AI (chat/generate routes).
        # Ditemukan & ditambal 23 Jul setelah insiden 502 di avathur.id.
        proxy_buffer_size 128k;
    }

    large_client_header_buffers 4 32k;
}
